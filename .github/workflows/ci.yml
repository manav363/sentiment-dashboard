name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        # The tests stub the model, so skip the multi-GB torch/transformers wheels.
        run: |
          grep -vE '^(torch|transformers)==' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  audit:
    # Fails on any known advisory in the dependencies we can test an upgrade for.
    # torch and transformers are excluded on purpose — see "Known limitations" in the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python dependencies
        run: |
          pip install pip-audit
          grep -vE '^(torch|transformers)==' backend/requirements.txt > /tmp/requirements-audit.txt
          pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip
      - name: Frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
